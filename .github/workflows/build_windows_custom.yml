name: Build Windows (custom)

# 手动触发：在 GitHub 仓库页面的 Actions 标签里点 "Run workflow"
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "编译模式"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest   # GitHub 官方 Windows 机器，已预装 VS2022 + MSVC + CMake + Ninja
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter（读取仓库内 .fvmrc 指定的版本）
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: 开启 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 拉取依赖（含仓库内 local_deps 的本地 fork 包）
        run: flutter pub get

      - name: 编译 Windows
        run: flutter build windows --${{ inputs.build_mode || 'release' }}

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: baka-windows-x64
          path: build/windows/x64/runner/Release/*
          if-no-files-found: error
