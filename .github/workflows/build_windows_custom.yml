name: Build Windows (custom)

# Manual trigger only: builds a Windows x64 bundle and uploads it as an artifact.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
      source_ref:
        description: "Branch or tag to build (leave empty to build the dispatched ref)"
        required: false
        type: string

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Flutter (from .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --${{ inputs.build_mode || 'release' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: baka-windows-x64
          path: build/windows/x64/runner/Release/*
          if-no-files-found: error
